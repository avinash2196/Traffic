<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Detail - RoadWatch Officer Portal</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <header>
    <h1>🚨 RoadWatch Officer - Case Detail</h1>
    <nav>
      <a href="/queue">Queue</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <main class="container">
    <section class="section" id="case-container">
      <p style="text-align: center;">Loading case...</p>
    </section>

    <section class="section" id="decision-container">
      <h2>Make Decision</h2>
      <form id="decision-form">
        <div class="form-group">
          <label for="decision_type">Decision *</label>
          <select id="decision_type" required>
            <option value="">-- Select --</option>
            <option value="approved">Approve & Award Points</option>
            <option value="rejected">Reject (No Points)</option>
          </select>
        </div>

        <!-- Points selector - shown when approved is selected -->
        <div class="form-group" id="points-group" style="display: none;">
          <label for="provisional_points">Provisional Points *</label>
          <div id="violation-points-panel" style="background: #f8f9fa; padding: 1rem; border-radius: 4px; margin: 0.5rem 0;">
            <p style="font-size: 0.9rem; color: #666; margin: 0 0 1rem 0;">
              Select violations detected by AI to calculate points:
            </p>
            <div id="violation-checkboxes" style="display: grid; gap: 0.75rem;">
              <!-- Checkboxes will be inserted here -->
            </div>
            <div style="background: white; padding: 1rem; border-radius: 4px; margin-top: 1rem; border: 2px solid #0d6efd;">
              <strong>Total Points: <span id="total-points" style="color: #0d6efd; font-size: 1.3em;">0</span></strong>
            </div>
          </div>
          <input type="hidden" id="provisional_points" value="0">
        </div>

        <div class="form-group">
          <label for="comments">Comments/Remarks</label>
          <textarea id="comments" placeholder="Optional: Explain your decision..."></textarea>
        </div>

        <div class="form-row">
          <button type="submit" class="btn btn-success" id="submit-decision">Submit Decision</button>
          <a href="/queue" class="btn btn-secondary">Back to Queue</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 RoadWatch Traffic MVP.</p>
  </footer>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    // CRITICAL FIX: Auth check with proper script loading guarantee
    function checkAuthAndLoad() {
      if (typeof AUTH === 'undefined' || !AUTH.isReviewer) {
        setTimeout(checkAuthAndLoad, 100);
        return;
      }
      
      if (!AUTH.isReviewer()) {
        window.location.href = '/login';
      } else {
        initializeDetailPage();
      }
    }
    
    function initializeDetailPage() {
      document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        AUTH.clearAuth();
        window.location.href = '/login';
      });

      const reportId = UTILS.getQueryParam('id');
      if (!reportId) {
        document.getElementById('case-container').innerHTML = '<div class="alert alert-error">No report ID specified</div>';
        document.getElementById('decision-container').style.display = 'none';
      } else {
        loadCase();
      }
    }
    
    async function loadCase() {
        const result = await API.getReviewDetail(reportId);

        if (!result.success) {
          document.getElementById('case-container').innerHTML = `
            <div class="alert alert-error">Failed to load case: ${result.error}</div>
            <a href="/queue" class="btn btn-secondary">Back to Queue</a>
          `;
          document.getElementById('decision-container').style.display = 'none';
          return;
        }

        const report = result.data;
        reportData = report; // Store globally for later use in decision form

        let html = `
          <h2>${UI.formatViolation(report.violation_type)}</h2>

          <div class="grid-2" style="margin: 1.5rem 0;">
            <div>
              <p><strong>Vehicle Number:</strong> ${report.vehicle_number}</p>
              <p><strong>Location:</strong> ${report.location}</p>
              <p><strong>Citizen ID:</strong> ${report.citizen_id}</p>
            </div>
            <div>
              <p><strong>Submitted:</strong> ${UI.formatDate(report.created_at)}</p>
              <p><strong>Status:</strong> ${report.status}</p>
            </div>
          </div>
        `;

        if (report.description) {
          html += `<p><strong>Description:</strong></p><p>${report.description}</p>`;
        }

        // AI Assessment Section (M10-M12)
        if (report.ai) {
          html += '<div style="background: #f8f9fa; border-left: 4px solid #0d6efd; padding: 1rem; margin: 1.5rem 0; border-radius: 4px;">';
          html += '<h3>🤖 AI Assessment</h3>';
          
          if (report.ai.state === 'failed') {
            html += `<div class="alert alert-warning"><strong>⚠️ AI Processing Failed</strong><br>`;
            html += `Reason: ${report.ai.failure_reason}<br>`;
            html += `Code: ${report.ai.failure_code}<br>`;
            html += `Attempts: ${report.ai.attempt_count}/${report.ai.max_attempts}`;
            html += `</div>`;
          } else if (report.ai.state === 'pending' || report.ai.state === 'processing') {
            html += `<div class="alert alert-info"><strong>⏳ AI Processing in Progress</strong><br>`;
            html += `State: ${report.ai.state}<br>`;
            html += `Attempts: ${report.ai.attempt_count}/${report.ai.max_attempts}`;
            html += `</div>`;
          } else if (report.ai.state === 'completed' || report.ai.state === 'success') {
            html += `<div class="alert alert-success"><strong>✅ AI Assessment Complete</strong></div>`;
            
            // Show violations detected
            if (report.assessment) {
              html += '<div style="margin: 1rem 0; padding: 1rem; background: white; border-radius: 4px;">';
              html += '<h4>Violations Detected:</h4>';
              html += '<table style="width: 100%; border-collapse: collapse;">';
              html += '<tr style="border-bottom: 1px solid #ddd;">';
              html += '<th style="text-align: left; padding: 0.5rem;">Violation Type</th>';
              html += '<th style="text-align: center; padding: 0.5rem;">Status</th>';
              html += '<th style="text-align: center; padding: 0.5rem;">Points</th>';
              html += '</tr>';
              
              // Helper function to show violation status
              const showViolation = (name, detected, points) => {
                const icon = detected ? '✅' : '❌';
                const color = detected ? '#28a745' : '#6c757d';
                html += `<tr style="border-bottom: 1px solid #eee;">`;
                html += `<td style="padding: 0.5rem;">${name}</td>`;
                html += `<td style="text-align: center; padding: 0.5rem; color: ${color};">${icon} ${detected ? 'Detected' : 'Not Detected'}</td>`;
                html += `<td style="text-align: center; padding: 0.5rem;">${detected ? points : '-'}</td>`;
                html += `</tr>`;
              };
              
              showViolation('No Helmet', report.assessment.no_helmet, 2);
              showViolation('Triple Riding', report.assessment.triple_riding, 3);
              showViolation('Red Light', report.assessment.red_light, 4);
              
              html += '</table>';
              html += '</div>';
              
              // Show recommendation
              if (report.assessment.recommendation) {
                html += `<p style="margin-top: 1rem;"><strong>AI Recommendation:</strong> <span style="color: #0d6efd; font-weight: bold;">${report.assessment.recommendation}</span></p>`;
              }
            }
            
            if (report.ai.recommendation) {
              html += `<p><strong>Outcome:</strong> ${report.ai.outcome || 'Unknown'}</p>`;
            }
          }
          
          html += `<p style="font-size: 0.9rem; color: #666; margin-top: 1rem;">`;
          html += `Processing time: ${report.ai.processing_ms || 0}ms | `;
          html += `Job ID: ${report.ai.job_id}<br>`;
          html += `Started: ${new Date(report.ai.started_at).toLocaleString()} | `;
          html += `Completed: ${report.ai.completed_at ? new Date(report.ai.completed_at).toLocaleString() : 'pending'}`;
          html += `</p>`;
          html += '</div>';
        }

        if (report.media && report.media.length > 0) {
          html += '<p><strong>Evidence Media:</strong></p>';
          report.media.forEach(m => {
            if (m.type === 'image') {
              html += `<div style="margin: 1rem 0;"><img src="${m.url}" class="media-preview" alt="Evidence" style="max-width: 100%; max-height: 400px; border: 1px solid #ddd; padding: 4px;"></div>`;
            } else if (m.type === 'video') {
              html += `<div style="margin: 1rem 0;"><video class="media-preview" controls style="max-width: 100%; max-height: 400px; border: 1px solid #ddd;"><source src="${m.url}" type="${m.mime_type}">Your browser does not support the video tag.</video></div>`;
            } else if (m.type === 'audio') {
              html += `<div style="margin: 1rem 0;"><audio controls style="width: 100%;"><source src="${m.url}" type="${m.mime_type}">Your browser does not support the audio tag.</audio></div>`;
            } else {
              html += `<div style="margin: 1rem 0;"><a href="${m.url}" target="_blank">${m.filename}</a></div>`;
            }
          });
        }

        // Download Evidence button (M6 integration)
        html += `
          <div style="margin: 1.5rem 0;">
            <button type="button" class="btn btn-secondary" id="download-evidence-btn">
              📥 Download Evidence ZIP
            </button>
          </div>
        `;

        document.getElementById('case-container').innerHTML = html;

        // Setup download button
        document.getElementById('download-evidence-btn').addEventListener('click', async () => {
          UI.showLoading('Downloading evidence...');
          const result = await API.downloadEvidence(reportId);
          UI.hideLoading();
          if (result.success) {
            UI.showToast('Evidence downloaded', 'success');
          } else {
            UI.showAlert(`Download failed: ${result.error}`, 'error');
          }
        });
      }

      loadCase();

      // Violation points mapping
      const violationPoints = {
        'no_helmet': 2,
        'triple_riding': 3,
        'red_light': 4
      };

      // Handle decision type change
      document.getElementById('decision_type').addEventListener('change', function(e) {
        const pointsGroup = document.getElementById('points-group');
        if (e.target.value === 'approved') {
          pointsGroup.style.display = 'block';
          // Populate violation checkboxes from assessment
          populateViolationCheckboxes();
        } else {
          pointsGroup.style.display = 'none';
        }
      });

      function populateViolationCheckboxes() {
        const checkboxesContainer = document.getElementById('violation-checkboxes');
        checkboxesContainer.innerHTML = '';

        if (!reportData || !reportData.assessment) {
          checkboxesContainer.innerHTML = '<p style="color: #999;">No AI assessment available</p>';
          return;
        }

        const assessment = reportData.assessment;
        const violations = [
          { key: 'no_helmet', label: 'No Helmet Violation', points: 2 },
          { key: 'triple_riding', label: 'Triple Riding Violation', points: 3 },
          { key: 'red_light', label: 'Red Light Violation', points: 4 }
        ];

        violations.forEach(violation => {
          const detected = assessment[violation.key] || false;
          const html = `
            <label style="display: flex; align-items: center; padding: 0.5rem; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">
              <input type="checkbox" class="violation-checkbox" data-violation="${violation.key}" data-points="${violation.points}" ${detected ? 'checked' : ''} ${detected ? '' : 'disabled'} style="margin-right: 0.5rem;">
              <span>
                <strong>${violation.label}</strong>
                <span style="margin-left: 0.5rem; color: #666; font-size: 0.9rem;">(${violation.points} pts)</span>
                <span style="margin-left: 0.5rem; ${detected ? 'color: #28a745;' : 'color: #999;'}">${detected ? '✅ Detected' : '❌ Not Detected'}</span>
              </span>
            </label>
          `;
          checkboxesContainer.innerHTML += html;
        });

        // Add event listeners to checkboxes
        document.querySelectorAll('.violation-checkbox').forEach(checkbox => {
          checkbox.addEventListener('change', updateTotalPoints);
        });

        updateTotalPoints();
      }

      let reportData = null;

      function updateTotalPoints() {
        let total = 0;
        document.querySelectorAll('.violation-checkbox:checked').forEach(checkbox => {
          total += parseInt(checkbox.dataset.points) || 0;
        });
        document.getElementById('total-points').textContent = total;
        document.getElementById('provisional_points').value = total;
      }

      // Handle decision submission
      document.getElementById('decision-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const decisionType = document.getElementById('decision_type').value;
        const comments = document.getElementById('comments').value;
        const provisionalPoints = parseInt(document.getElementById('provisional_points').value) || 0;

        if (!decisionType) {
          UI.showAlert('Please select a decision', 'error');
          return;
        }

        if (decisionType === 'approved' && provisionalPoints === 0) {
          const confirmed = await UI.confirmAction('Award 0 points? Make sure you selected violations.');
          if (!confirmed) return;
        }

        const confirmed = await UI.confirmAction(`Confirm ${decisionType} decision?`);
        if (!confirmed) return;

        UI.showLoading('Submitting decision...');
        UI.disableButton(document.getElementById('submit-decision'));

        const result = await API.submitDecision(reportId, {
          decision_type: decisionType,
          comments: comments,
          provisional_points: provisionalPoints
        });

        UI.hideLoading();

        if (result.success) {
          UI.showToast('Decision recorded successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/queue';
          }, 1500);
        } else {
          UI.showAlert(`Failed: ${result.error}`, 'error');
          UI.enableButton(document.getElementById('submit-decision'));
        }
      });
    }
    
    checkAuthAndLoad();
  </script>
</body>
</html>

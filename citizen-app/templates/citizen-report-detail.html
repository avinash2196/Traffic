<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Detail - RoadWatch Traffic MVP</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <header>
    <h1>🚗 RoadWatch - Report Detail</h1>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/reports">My Reports</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <main class="container">
    <section class="section" id="detail-container">
      <p style="text-align: center;">Loading report...</p>
    </section>

    <section class="section" id="timeline-container">
      <h2>Review Timeline</h2>
      <div id="timeline-content">
        <p style="text-align: center; color: #999;">No updates yet.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 RoadWatch Traffic MVP.</p>
  </footer>

  <script src="/static/js/auto-login.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    // Load config from frontend server FIRST
    window.CONFIG = {};
    async function loadConfig() {
      try {
        const response = await fetch('/config');
        window.CONFIG = await response.json();
      } catch (err) {
        window.CONFIG = { api: { citizen: 'http://127.0.0.1:9001' } };
      }
    }
    
    // Initialize config before auth check
    loadConfig().then(() => {
      checkAuthAndLoad();
    });
    
    // CRITICAL FIX: Auth check with proper script loading guarantee
    let reportId; // Define at module level
    
    function checkAuthAndLoad() {
      if (typeof AUTH === 'undefined' || !AUTH.isCitizen) {
        setTimeout(checkAuthAndLoad, 100);
        return;
      }
      
      if (!AUTH.isCitizen()) {
        window.location.href = '/login';
      } else {
        initializeDetailPage();
      }
    }
    
    function initializeDetailPage() {
      document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        AUTH.clearAuth();
        window.location.href = '/login';
      });

      reportId = UTILS.getQueryParam('id');
      if (!reportId) {
        document.getElementById('detail-container').innerHTML = '<div class="alert alert-error">No report ID specified</div>';
      } else {
        loadReport();
      }
    }
    
    async function loadReport() {
        const result = await API.getReportDetail(reportId);

        if (!result.success) {
          document.getElementById('detail-container').innerHTML = `
            <div class="alert alert-error">Failed to load report: ${result.error}</div>
            <a href="/reports" class="btn btn-secondary">Back to Reports</a>
          `;
          return;
        }

        const report = result.data;
        const statusBadge = UI.getStatusBadge(report.status);

        let html = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>${UI.formatViolation(report.violation_type)}</h2>
            ${statusBadge}
          </div>

          <div class="grid-2" style="margin-bottom: 1.5rem;">
            <div>
              <p><strong>Vehicle Number:</strong> ${report.vehicle_number}</p>
              <p><strong>Location:</strong> ${report.location}</p>
              <p><strong>Submitted:</strong> ${UI.formatDate(report.created_at)}</p>
            </div>
            <div>
              <p><strong>Status:</strong> ${report.status}</p>
              <p><strong>Provisional Points:</strong> <span style="font-size: 1.5rem; font-weight: bold; color: #dc3545;">${report.provisional_points || 0}</span></p>
            </div>
          </div>
        `;

        if (report.description) {
          html += `<p><strong>Description:</strong></p><p>${report.description}</p>`;
        }

        // AI Assessment Section (for transparency)
        if (report.ai) {
          html += '<div style="background: #f8f9fa; border-left: 4px solid #0d6efd; padding: 1rem; margin: 1.5rem 0; border-radius: 4px;">';
          html += '<h3>🤖 AI Assessment Status</h3>';
          
          if (report.ai.state === 'failed') {
            html += `<p><strong style="color: #dc3545;">⚠️ Assessment failed</strong> (${report.ai.failure_reason})</p>`;
          } else if (report.ai.state === 'pending' || report.ai.state === 'processing') {
            html += `<p><strong style="color: #0d6efd;">⏳ Assessment in progress...</strong></p>`;
          } else if (report.ai.state === 'success') {
            html += `<p><strong style="color: #198754;">✅ Assessment complete</strong></p>`;
            if (report.ai.recommendation) {
              html += `<p>Recommendation: ${report.ai.recommendation}</p>`;
            }
          }
          html += '</div>';
        }

        if (report.media && report.media.length > 0) {
          html += '<p><strong>Evidence:</strong></p>';
          html += '<div style="display: flex; flex-wrap: wrap; gap: 1rem;">';
          report.media.forEach((media, index) => {
            const mediaId = `media-${index}`;
            if (media.type === 'image') {
              html += `<div style="flex: 1; min-width: 300px;"><img id="${mediaId}" style="max-width: 100%; height: auto; border-radius: 4px;" alt="${media.filename}" onerror="console.error('Image failed to load')"></div>`;
            } else if (media.type === 'video') {
              html += `<div style="flex: 1; min-width: 300px;"><video id="${mediaId}" controls style="max-width: 100%; height: auto; border-radius: 4px;"></video></div>`;
            } else if (media.type === 'audio') {
              html += `<div style="flex: 1; min-width: 300px;"><audio id="${mediaId}" controls style="width: 100%;"></audio></div>`;
            }
          });
          html += '</div>';
        }

        html += `<a href="/reports" class="btn btn-secondary" style="margin-top: 1rem;">Back to Reports</a>`;

        document.getElementById('detail-container').innerHTML = html;

        // Load media files with authentication
        if (report.media && report.media.length > 0) {
          report.media.forEach(async (media, index) => {
            const mediaId = `media-${index}`;
            const mediaElement = document.getElementById(mediaId);
            if (!mediaElement) return;

            try {
              // Fetch media with auth headers (demo mode uses X-Citizen-Id)
              const citizenId = AUTH.getCitizenId();
              const headers = {};
              
              if (citizenId) {
                headers['X-Citizen-Id'] = citizenId;
              }

              // Convert relative URLs to absolute URLs using config API base
              let mediaUrl = media.url;
              if (mediaUrl.startsWith('/')) {
                // Ensure window.CONFIG is loaded
                if (!window.CONFIG || !window.CONFIG.api || !window.CONFIG.api.citizen) {
                  await new Promise(resolve => setTimeout(resolve, 500)); // Wait for config
                }
                const citizenApiBase = (window.CONFIG?.api?.citizen) || 'http://127.0.0.1:9001';
                mediaUrl = citizenApiBase + mediaUrl;
              }

              const response = await fetch(mediaUrl, { headers });
              if (!response.ok) {
                console.error(`Failed to load media: ${response.status}`);
                return;
              }

              const blob = await response.blob();
              const blobUrl = URL.createObjectURL(blob);

              if (media.type === 'image') {
                mediaElement.src = blobUrl;
              } else if (media.type === 'video' || media.type === 'audio') {
                const source = document.createElement('source');
                source.src = blobUrl;
                source.type = blob.type;
                mediaElement.appendChild(source);
              }
            } catch (error) {
              console.error(`Error loading media ${mediaId}:`, error);
            }
          });
        }

        // Auto-refresh every 30 seconds
        setInterval(() => {
          if (reportId) {
            loadReport();
          }
        }, API.POLL_INTERVAL_MS);
    }
  </script>
</body>
</html>

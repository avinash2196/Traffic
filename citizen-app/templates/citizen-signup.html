<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Sign Up - RoadWatch Traffic MVP</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .signup-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    
    .signup-container h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #333;
    }
    
    .signup-container p {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    
    .form-group input {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h1>🚗 RoadWatch</h1>
    <p>Citizen Sign Up - Report Traffic Violations</p>
    
    <form id="signup-form">
      <div class="form-group">
        <label for="full_name">Full Name *</label>
        <input 
          type="text" 
          id="full_name" 
          name="full_name" 
          placeholder="Your full name"
          required
          minlength="3"
        >
      </div>
      
      <div class="form-group">
        <label for="email">Email *</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="citizen@example.com"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="password">Password *</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter password (min 8 characters)"
          required
          minlength="8"
        >
      </div>
      
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      
      <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ddd;">
      
      <p style="text-align: center; color: #666; font-size: 0.85rem;">
        Already have an account? <a href="/login">Login here</a>
      </p>
      
      <p style="text-align: center; color: #666; font-size: 0.85rem;">
        Are you an officer? <a href="http://127.0.0.1:3002/">Login here</a>
      </p>
    </form>
  </div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    // Load config
    window.CONFIG = {};
    async function loadConfig() {
      try {
        const response = await fetch('/config');
        window.CONFIG = await response.json();
      } catch (err) {
        window.CONFIG = { api: { auth: 'http://127.0.0.1:9003' } };
      }
    }
    
    loadConfig();
    
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!fullName || !email || !password) {
        UI.showAlert('Please fill all fields', 'error');
        return;
      }
      
      try {
        UI.showLoading('Creating account...');
        
        const response = await fetch(`${window.CONFIG.api.auth}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            password: password
            // citizen_id is auto-generated by backend
          })
        });
        
        UI.hideLoading();
        
        if (response.ok) {
          const data = await response.json();
          AUTH.setCitizenId(data.citizen_id);
          UI.showAlert('Account created! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1500);
        } else {
          const error = await response.json();
          UI.showAlert(error.error || 'Signup failed', 'error');
        }
      } catch (err) {
        UI.hideLoading();
        UI.showAlert('Error: ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Login - RoadWatch Traffic MVP</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    
    .login-container h1 {
      text-align: center;
      margin-bottom: 1rem;
      color: #333;
    }
    
    .login-container p {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    
    .form-group input {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🚗 RoadWatch</h1>
    <p>Citizen Portal - Report Traffic Violations</p>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password"
          required
          minlength="8"
        >
      </div>
      
      <button type="submit" class="btn btn-primary btn-block">Login</button>
      
      <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ddd;">
      
      <p style="text-align: center; color: #666; font-size: 0.85rem;">
        New user? <a href="/signup">Create account</a>
      </p>
      
      <p style="text-align: center; color: #666; font-size: 0.85rem;">
        Are you an officer? <a href="http://127.0.0.1:3002/">Login here</a>
      </p>
    </form>
  </div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    // Load config
    window.CONFIG = {};
    async function loadConfig() {
      try {
        const response = await fetch('/config');
        window.CONFIG = await response.json();
      } catch (err) {
        window.CONFIG = { api: { auth: 'http://127.0.0.1:9003' } };
      }
    }
    
    loadConfig();
    
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        UI.showAlert('Please enter email and password', 'error');
        return;
      }
      
      try {
        UI.showLoading('Logging in...');
        
        const response = await fetch(`${window.CONFIG.api.auth}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });
        
        UI.hideLoading();
        
        if (response.ok) {
          const data = await response.json();
          const citizenId = data.citizen_id;
          AUTH.setCitizenId(citizenId);
          UI.showToast(`Welcome, ${citizenId}!`, 'success');
          // Redirect to reports page
          setTimeout(() => {
            window.location.href = '/reports';
          }, 800);
        } else {
          const error = await response.json();
          UI.showAlert(error.error || 'Login failed', 'error');
        }
      } catch (err) {
        UI.hideLoading();
        UI.showAlert('Error: ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>

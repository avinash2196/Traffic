<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports - RoadWatch Traffic MVP</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <header>
    <h1>🚗 RoadWatch - My Reports</h1>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/report">Report</a>
      <a href="/reports">My Reports</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h2>My Reports</h2>
      <p>View all your submitted violation reports and their review status.</p>

      <div id="reports-container">
        <p style="text-align: center; color: #666;">Loading reports...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 RoadWatch Traffic MVP.</p>
  </footer>

  <script src="/static/js/auto-login.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    // Auth check with script loading guarantee
    function checkAuthAndInitialize() {
      if (typeof AUTH === 'undefined' || !AUTH.isCitizen) {
        setTimeout(checkAuthAndInitialize, 50);
        return;
      }
      
      if (!AUTH.isCitizen()) {
        window.location.href = '/login';
      } else {
        // Auth OK, setup UI
        document.getElementById('logout-link').addEventListener('click', (e) => {
          e.preventDefault();
          AUTH.clearAuth();
          window.location.href = '/login';
        });
        loadReports();
      }
    }

    async function loadReports() {
      const result = await API.getReports();
      const container = document.getElementById('reports-container');

      if (!result.success) {
        container.innerHTML = `<div class="alert alert-error">Failed to load reports: ${result.error}</div>`;
        return;
      }

      const reports = result.data.reports || [];
      if (reports.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999;">No reports submitted yet. <a href="/report">Create one</a></p>';
        return;
      }

      let html = '';
      reports.forEach(report => {
        const statusBadge = UI.getStatusBadge(report.status);
        html += `
          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title">${UI.formatViolation(report.violation_type)}</h3>
                <p style="font-size: 0.9rem; color: #666;">${report.vehicle_number} | ${report.location}</p>
              </div>
              <div>${statusBadge}</div>
            </div>
            <div class="card-content">
              <p><strong>Submitted:</strong> ${UI.formatDate(report.created_at)}</p>
              <p><strong>Points:</strong> <span style="font-size: 1.25rem; font-weight: bold; color: #dc3545;">${report.provisional_points || 0}</span></p>
            </div>
            <div class="card-footer">
              <a href="/report-detail?id=${report.id}" class="btn btn-primary btn-small">View Details & Evidence</a>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Start auth check
    checkAuthAndInitialize();
  </script>
</body>
</html>

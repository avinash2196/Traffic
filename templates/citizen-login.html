<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Login - RoadWatch Traffic MVP</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    
    .login-container h1 {
      text-align: center;
      margin-bottom: 1rem;
      color: #333;
    }
    
    .login-container p {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    
    .form-group input {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🚗 RoadWatch</h1>
    <p>Citizen Portal - Report Traffic Violations</p>
    
    <form id="login-form">
      <div class="form-group">
        <label for="citizen_id">Citizen ID</label>
        <input 
          type="text" 
          id="citizen_id" 
          name="citizen_id" 
          placeholder="Enter your ID"
          required
          minlength="3"
        >
        <small style="color: #666;">Any ID (demo mode)</small>
      </div>
      
      <button type="submit" class="btn btn-primary btn-block">Login</button>
      
      <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ddd;">
      
      <p style="text-align: center; color: #666; font-size: 0.85rem;">
        New user? <a href="/citizen-signup.html">Create account</a>
      </p>
      
      <p style="text-align: center; color: #666; font-size: 0.85rem;">
        Are you an officer? <a href="/officer-login.html">Login here</a>
      </p>
    </form>
  </div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const citizenId = document.getElementById('citizen_id').value.trim();
      if (!citizenId) {
        UI.showAlert('Please enter a Citizen ID', 'error');
        return;
      }
      
      if (citizenId.length < 3) {
        UI.showAlert('Citizen ID must be at least 3 characters', 'error');
        return;
      }
      
      // For MVP demo: just store citizen_id (no password needed)
      AUTH.setCitizenId(citizenId);
      
      UI.showToast(`Welcome, ${citizenId}!`, 'success');
      
      // Redirect to reports page
      setTimeout(() => {
        window.location.href = '/citizen-reports.html';
      }, 800);
    });
  </script>
</body>
</html>

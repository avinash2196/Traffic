<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Violation - RoadWatch Traffic MVP</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <header>
    <h1>🚗 RoadWatch - Report Violation</h1>
    <nav>
      <a href="/citizen-dashboard.html">Dashboard</a>
      <a href="/citizen-report.html">Report</a>
      <a href="/citizen-reports.html">My Reports</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h2>Report Traffic Violation</h2>
      <p>Submit evidence (photo or video) with violation details.</p>

      <form id="report-form">
        <div class="form-row">
          <div class="form-group">
            <label for="violation_type">Violation Type *</label>
            <select id="violation_type" required>
              <option value="">-- Select --</option>
              <option value="helmet">No Helmet (2 points)</option>
              <option value="triple_riding">Triple Riding (3 points)</option>
              <option value="red_light">Red Light (3 points)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="vehicle_number">Vehicle Number *</label>
            <input type="text" id="vehicle_number" placeholder="e.g., DL-01-AB-1234" required>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <input type="text" id="location" placeholder="e.g., Main Street, Traffic Light Junction" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Provide details about the violation..."></textarea>
        </div>

        <div class="form-group">
          <label for="media_file">Upload Evidence (Photo/Video) *</label>
          <input type="file" id="media_file" accept="image/*,video/*" required>
          <small>Max 50MB. Formats: JPG, PNG, MP4, MOV</small>
        </div>

        <div id="media-preview" style="display: none; margin: 1rem 0;">
          <img id="preview-image" class="media-preview" style="display: none;">
          <video id="preview-video" class="media-preview" style="display: none;" controls></video>
        </div>

        <div class="form-row">
          <button type="submit" class="btn btn-primary" id="submit-btn">Submit Report</button>
          <a href="/citizen-dashboard.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 RoadWatch Traffic MVP.</p>
  </footer>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    // CRITICAL FIX: Auth check with proper script loading guarantee
    function checkAuthAndLoad() {
      if (typeof AUTH === 'undefined' || !AUTH.isCitizen) {
        setTimeout(checkAuthAndLoad, 100);
        return;
      }
      
      if (!AUTH.isCitizen()) {
        window.location.href = '/citizen-login.html';
      } else {
        initializeReportForm();
      }
    }
    
    function initializeReportForm() {
      document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        AUTH.clearAuth();
        window.location.href = '/citizen-login.html';
      });

    // Preview media
    document.getElementById('media_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const previewDiv = document.getElementById('media-preview');
      const previewImg = document.getElementById('preview-image');
      const previewVid = document.getElementById('preview-video');

      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewImg.style.display = 'block';
          previewVid.style.display = 'none';
          previewDiv.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else if (file.type.startsWith('video/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewVid.src = e.target.result;
          previewVid.style.display = 'block';
          previewImg.style.display = 'none';
          previewDiv.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Submit form
    document.getElementById('report-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const violationType = document.getElementById('violation_type').value;
      const vehicleNumber = document.getElementById('vehicle_number').value;
      const location = document.getElementById('location').value;
      const description = document.getElementById('description').value;
      const mediaFile = document.getElementById('media_file').files[0];

      if (!violationType || !vehicleNumber || !location || !mediaFile) {
        UI.showAlert('Please fill all required fields', 'error');
        return;
      }

      UI.showLoading('Uploading evidence...');
      UI.disableButton(document.getElementById('submit-btn'));

      try {
        const citizenId = AUTH.getCitizenId();

        // Step 1: Upload media file
        const mediaFormData = new FormData();
        mediaFormData.append('media_file', mediaFile);

        UI.showLoading('Uploading image...');

        const uploadResponse = await fetch('/api/media/upload', {
          method: 'POST',
          headers: {
            'X-Citizen-Id': citizenId,
          },
          body: mediaFormData,
        });

        if (!uploadResponse.ok) {
          const error = await uploadResponse.json();
          UI.hideLoading();
          UI.showAlert(error.error || 'Failed to upload media', 'error');
          UI.enableButton(document.getElementById('submit-btn'));
          return;
        }

        const mediaData = await uploadResponse.json();
        const mediaId = mediaData.media_id;

        // Step 2: Submit report with media_id (keep loading wheel showing)
        UI.showLoading('Creating report...');

        const reportResponse = await fetch('/api/reports', {
          method: 'POST',
          headers: {
            'X-Citizen-Id': citizenId,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            violation_type: violationType,
            vehicle_number: vehicleNumber,
            location: location,
            media_id: mediaId,
          }),
        });

        UI.hideLoading();

        if (reportResponse.ok) {
          const reportData = await reportResponse.json();
          // Show duplicate message only after successful report submission
          if (mediaData.is_duplicate) {
            UI.showToast(mediaData.duplicate_reason || 'Using previously uploaded image', 'info');
          } else {
            UI.showToast('Report submitted successfully!', 'success');
          }
          setTimeout(() => {
            window.location.href = `/citizen-dashboard.html`;
          }, 1500);
        } else {
          const error = await reportResponse.json();
          UI.showAlert(error.error || 'Failed to submit report', 'error');
          UI.enableButton(document.getElementById('submit-btn'));
        }
      } catch (error) {
        UI.hideLoading();
        UI.showAlert(`Error: ${error.message}`, 'error');
        UI.enableButton(document.getElementById('submit-btn'));
      }
    });
    }
    
    checkAuthAndLoad();
  </script>
</body>
</html>
